services:
  app:
    build: .
    ports:
      - 8080:8080
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: orders
      DB_USER: orders_user
      DB_PASSWORD: orders_password
      GOOGLE_MAP_API_KEY: ${GOOGLE_MAP_API_KEY}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_password
      POSTGRES_DB: orders
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
