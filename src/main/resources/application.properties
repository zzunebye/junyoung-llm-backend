spring.application.name=llm-order-api

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders}
spring.datasource.username=${DB_USER:orders_user}
spring.datasource.password=${DB_PASSWORD:orders_password}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

maps.provider=GOOGLE
maps.api-key=${GOOGLE_MAPS_API_KEY}